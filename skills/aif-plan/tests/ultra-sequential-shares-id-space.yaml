scenario: ultra-sequential-shares-id-space
description: |
  Explicit ultra mode is additive and uses the same sequential ID space as
  full plans. Existing 0002 full and 0004 ultra artifacts require the new
  bundle to use 0005. The planner must write phase files plus index.md and
  must not replace the bundle with a single .md plan.
skill: aif-plan
argument: "ultra add product search API"
max_turns: 60

runner:
  model: claude-sonnet-4-6
  permission_mode: bypassPermissions

fixtures:
  git_init: true
  git_branch: main
  files_committed:
    - path: package.json
      content: '{"name":"demo","version":"0.1.0"}'
    - path: .ai-factory/config.yaml
      content: |
        paths:
          plan: .ai-factory/PLAN.md
          plans: .ai-factory/plans/
        workflow:
          plan_id_format: sequential
        git:
          enabled: false
          create_branches: false
    - path: .ai-factory/plans/0002_previous.md
      content: |
        # Previous
        ## Tasks
        - [x] Task 1: done
    - path: .ai-factory/plans/0004_other/index.md
      content: |
        # Ultra Implementation Plan: Other
        Mode: ultra
        ## Phase Index
        1. [Phase 1](phase-01-other.md) — Task 1
        ## Tasks
        - [x] Task 1: done
    - path: .ai-factory/plans/0004_other/phase-01-other.md
      content: |
        # Phase 1: Other
        ## Task 1: done

user_responses:
  - match_question: "(?i)test"
    choose: "Yes"
  - match_question: "(?i)log"
    choose: "Verbose"
  - match_question: "(?i)doc"
    choose: "Yes"
  - match_question: "(?i)(roadmap|milestone)"
    choose: "Skip"

assertions:
  - id: writes-ultra-index-with-shared-next-id
    type: tool_called
    tool: Write
    args_match:
      file_path: "\\.ai-factory/plans/0005_add-product-search-api/index\\.md$"
    weight: 4
  - id: writes-at-least-one-phase
    type: tool_called
    tool: Write
    args_match:
      file_path: "\\.ai-factory/plans/0005_add-product-search-api/phase-[0-9]{2}-.*\\.md$"
    weight: 3
  - id: does-not-write-single-file-ultra
    type: no_tool_called
    tool: Write
    args_match:
      file_path: "\\.ai-factory/plans/0005_add-product-search-api\\.md$"
  - id: stay-in-sandbox
    type: no_path_escape
