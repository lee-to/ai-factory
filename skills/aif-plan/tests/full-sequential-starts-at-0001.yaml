scenario: full-sequential-starts-at-0001
description: |
  Full-mode planning with `workflow.plan_id_format: sequential` and an empty
  `paths.plans/` directory must start the numbering from `0001`.

  Fixture state:
    .ai-factory/plans/.gitkeep   (empty directory marker)

  Expected: the new plan is written under
    .ai-factory/plans/0001_<slug>.md

  Verifies the empty-directory branch of Step 1.2's algorithm in
  skills/aif-plan/SKILL.md (`next = (max(prefixes) + 1) if any matches exist,
  else 1`).
skill: aif-plan
argument: "full add product search API"

runner:
  model: claude-sonnet-4-6
  permission_mode: bypassPermissions
  allowed_tools_override:
    - Read
    - Write
    - Glob
    - Grep
    - Bash(git *)
    - Bash(ls *)
    - Bash(mkdir *)
    - Bash(basename *)
    - Bash(cd *)
    - AskUserQuestion
    - Questions
    - TaskCreate
    - TaskUpdate
    - TaskList

fixtures:
  git_init: true
  git_branch: main
  files_committed:
    - path: README.md
      content: |
        # Demo repo

        Fixture for the aif-plan sequential numbering scenario (empty-dir start).
    - path: package.json
      content: |
        {
          "name": "demo",
          "version": "0.1.0"
        }
    - path: .ai-factory/config.yaml
      content: |
        paths:
          plan: .ai-factory/PLAN.md
          plans: .ai-factory/plans/
        workflow:
          plan_id_format: sequential
        git:
          enabled: true
          base_branch: main
          create_branches: true
          branch_prefix: feature/
    - path: .ai-factory/plans/.gitkeep
      content: ""

user_responses:
  - match_question: "(?i)\\b(fast|full)\\b"
    choose: "Full"
  - match_question: "(?i)test"
    choose: "Yes, write tests"
  - match_question: "(?i)log"
    choose: "Verbose"
  - match_question: "(?i)doc"
    choose: "Yes"
  - match_question: "(?i)(requirement|constraint|clarif)"
    choose: "None"
  - match_question: "(?i)(roadmap|milestone|linkage)"
    choose: "Skip — no linkage"
  - match_question: "(?i)(proceed|confirm|ready|start|approve)"
    choose: "Yes"

assertions:
  - id: writes-sequential-prefix-0001
    type: tool_called
    tool: Write
    args_match:
      file_path: "\\.ai-factory/plans/0001_[a-z0-9-]+\\.md$"
    weight: 3

  - id: not-writing-without-prefix
    type: no_tool_called
    tool: Write
    args_match:
      file_path: "\\.ai-factory/plans/(?!0001_)[a-z0-9-]+\\.md$"

  - id: stay-in-sandbox
    type: no_path_escape
