scenario: deferred-doc-noop-resume
description: |
  Resuming an incremental-at-end plan after a persisted documentation skip or
  unchanged-doc no-op must retain that visible terminal outcome without asking
  for or reconciling a nonexistent commit.
skill: aif-implement
argument: ""

runner:
  permission_mode: bypassPermissions
  allowed_tools_override:
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Bash(git *)
    - AskUserQuestion
    - Questions
    - TaskCreate
    - TaskUpdate
    - TaskList

fixtures:
  git_init: true
  git_branch: feature/docs-noop-resume
  files_committed:
    - path: .ai-factory/plans/feature-docs-noop-resume.md
      content: |
        # Implementation Plan: Resume no-op outcomes

        ## Settings
        - Testing: yes
        - Logging: verbose
        - Docs: yes
        - Commit strategy: incremental-at-end

        ## Tasks
        - [x] Task 1: Implement the feature
          Files: src/feature.js
        - [x] Task 2: Update the documentation <!-- aif:task-outcome:skipped reason="documentation-skipped" -->
          Files: docs/feature.md
        <!-- aif:task-kind:commit -->
        - [x] Task 3: Commit documentation with message "docs: document feature" <!-- aif:commit-outcome:skipped-no-op reason="documentation-skipped" -->
          Depends on: 2
    - path: src/feature.js
      content: "export const feature = true;\n"

assertions:
  - id: reads-saved-noop-outcome
    type: tool_called
    tool: Read
    args_match:
      file_path: "\\.ai-factory/plans/feature-docs-noop-resume\\.md$"
  - id: inspects-history-during-resume
    type: tool_called
    tool: Bash
    args_match:
      command: "^git log"
    weight: 2
  - id: no-empty-commit-on-resume
    type: no_tool_called
    tool: Bash
    args_match:
      command: "^git commit"
  - id: keeps-skip-reason-visible
    type: output_contains
    pattern: "(?i)documentation-skipped|documentation skipped"
