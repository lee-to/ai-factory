scenario: deferred-doc-noop-stale-change
description: |
  A persisted docs-only no-op marker must not hide later staged, unstaged, or
  untracked changes owned by the documentation group. Resume stops with an
  integrity error instead of treating the old no-op as current.
skill: aif-implement
argument: ""

runner:
  permission_mode: bypassPermissions
  allowed_tools_override:
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Bash(git *)
    - AskUserQuestion
    - Questions
    - TaskCreate
    - TaskUpdate
    - TaskList

fixtures:
  git_init: true
  git_branch: feature/docs-noop-stale
  files_committed:
    - path: .ai-factory/plans/feature-docs-noop-stale.md
      content: |
        # Implementation Plan: Stale documentation no-op

        ## Settings
        - Testing: yes
        - Logging: verbose
        - Docs: yes
        - Commit strategy: incremental-at-end

        ## Tasks
        - [x] Task 1: Implement the feature
          Files: src/feature.js
        - [x] Task 2: Update the documentation <!-- aif:task-outcome:skipped reason="documentation-skipped" -->
          Files: docs/feature.md
        <!-- aif:task-kind:commit -->
        - [x] Task 3: Commit documentation with message "docs: document feature" <!-- aif:commit-outcome:skipped-no-op reason="documentation-skipped" -->
          Depends on: 2
    - path: src/feature.js
      content: "export const feature = true;\n"
    - path: docs/feature.md
      content: |
        # Feature

        Existing documentation.
  files_unstaged:
    - path: docs/feature.md
      content: |
        # Feature

        Documentation changed after the no-op outcome was recorded.

assertions:
  - id: reads-plan-and-checks-current-worktree
    type: tool_call_sequence
    sequence:
      - tool: Read
        args_match:
          file_path: "\\.ai-factory/plans/feature-docs-noop-stale\\.md$"
      - tool: Bash
        args_match:
          command: "^git status --porcelain"
      - tool: Bash
        args_match:
          command: "^git diff"
    weight: 4
  - id: reports-stale-noop-integrity-error
    type: output_contains
    pattern: "(?i)(stale|outstanding|changed).{0,80}(documentation|docs|no-op|no-op marker|integrity)|(documentation|docs).{0,80}(stale|outstanding change|integrity error)"
  - id: does-not-rewrite-or-complete-stale-result
    type: no_tool_called
    tool: Edit
    args_match:
      file_path: "\\.ai-factory/plans/feature-docs-noop-stale\\.md$"
  - id: does-not-attempt-empty-or-new-commit
    type: no_tool_called
    tool: Bash
    args_match:
      command: "^git commit"
  - id: preserves-current-doc-change
    type: no_tool_called
    tool: Bash
    args_match:
      command: "^git checkout|^git restore|^git reset"
