scenario: commit-task-recognition
description: |
  aif-implement should recognize commit tasks in task-based plan structure and
  invoke /aif-commit when encountered. This scenario checks the incremental
  strategy through a local commit and task completion.
skill: aif-implement
argument: ""

runner:
  model: claude-sonnet-4-6
  permission_mode: bypassPermissions
  allowed_tools_override:
    - Read
    - Write
    - Glob
    - Grep
    - Bash(git *)
    - Bash(mkdir *)
    - Bash(basename *)
    - Bash(cd *)
    - AskUserQuestion
    - Questions
    - TaskCreate
    - TaskUpdate
    - TaskList

fixtures:
  git_init: true
  git_branch: feature/test-commit-tasks
  files_committed:
    - path: README.md
      content: |
        # Demo API

        Tiny Node.js API skeleton.
    - path: package.json
      content: |
        {
          "name": "demo-api",
          "version": "0.1.0",
          "type": "module",
          "dependencies": { "express": "^4.0.0" }
        }
    - path: .ai-factory/plans/feature-test-commit-tasks.md
      content: |
        # Implementation Plan: Test Commit Tasks

        Branch: feature/test-commit-tasks
        Created: 2026-09-20

        ## Original Request

        Test commit task recognition

        ## Settings
        - Testing: yes
        - Logging: verbose
        - Docs: yes
        - Commit strategy: incremental
        - Development methodology: implementation-first

        ## Tasks

        ### Phase 1: Implementation
        - [x] Task 1: Implement user service
          Files: src/services/user.ts
        - [x] Task 2: Write unit tests for user service
          Files: tests/user.test.ts
          Depends on: 1
        <!-- aif:task-kind:commit -->
        - [ ] Task 3: Commit changes with message "feat: implement user service"
          Depends on: 1,2
  files_staged:
    - path: src/services/user.ts
      content: |
        export function getUser(id) {
          return { id, name: "Ada" };
        }
    - path: tests/user.test.ts
      content: |
        import { getUser } from "../src/services/user.js";
        if (getUser(7).name !== "Ada") throw new Error("unexpected user");

user_responses:
  - match_question: "(?i)commit"
    choose: "Commit this group"
  - match_question: "(?i)push"
    choose: "Skip push"

assertions:
  - id: recognizes-commit-task
    type: tool_called
    tool: TaskUpdate
    args_match:
      taskId: "(?i)^(?:3|task[-_ ]?3)$"
      status: "completed"
    weight: 3

  - id: commits-and-verifies-before-completing-task
    type: tool_call_sequence
    sequence:
      - tool: Bash
        args_match:
          command: "^git diff --cached"
      - tool: AskUserQuestion
        args_match:
          question: "(?i)commit"
      - tool: Bash
        args_match:
          command: "^git commit .*feat: implement user service"
      - tool: Bash
        args_match:
          command: "^git (show|diff-tree|diff)"
      - tool: TaskUpdate
        args_match:
          taskId: "(?i)^(?:3|task[-_ ]?3)$"
          status: "completed"
    weight: 4

  - id: persists-commit-task-checkbox
    type: tool_called
    tool: Edit
    args_match:
      file_path: "\\.ai-factory/plans/feature-test-commit-tasks\\.md$"
      new_string: "- \\[x\\] Task 3"
    weight: 3

  - id: reports-resulting-commit-hash
    type: output_contains
    pattern: "(?is)(commit|committed).{0,100}[0-9a-f]{7,40}"
