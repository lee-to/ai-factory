scenario: deferred-doc-unchanged-noop
description: |
  When /aif-docs produces no changes for the reserved documentation task in an
  incremental-at-end plan, persist a terminal unchanged/no-op outcome and omit
  its empty commit.
skill: aif-implement
argument: ""

runner:
  permission_mode: bypassPermissions
  allowed_tools_override:
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Bash(git *)
    - AskUserQuestion
    - Questions
    - TaskCreate
    - TaskUpdate
    - TaskList

fixtures:
  git_init: true
  git_branch: feature/docs-unchanged
  files_committed:
    - path: .ai-factory/plans/feature-docs-unchanged.md
      content: |
        # Implementation Plan: Documentation already current

        ## Settings
        - Testing: yes
        - Logging: verbose
        - Docs: yes
        - Commit strategy: incremental-at-end

        ## Tasks
        - [x] Task 1: Implement the feature
          Files: src/feature.js
        - [ ] Task 2: Check and update feature documentation
          Files: docs/feature.md
        <!-- aif:task-kind:commit -->
        - [ ] Task 3: Commit documentation with message "docs: document feature"
          Depends on: 2
    - path: src/feature.js
      content: "export const feature = true;\n"
    - path: docs/feature.md
      content: |
        # Feature

        The feature is current and documented.

user_responses:
  - match_question: "(?i)(documentation|docs)"
    choose: "Update"

assertions:
  - id: checks-documentation-task
    type: tool_call_sequence
    sequence:
      - tool: AskUserQuestion
        args_match:
          question: "(?i)(documentation|docs)"
      - tool: Read
        args_match:
          file_path: "docs/feature\\.md$"
    weight: 2
  - id: persists-unchanged-terminal-outcomes
    type: tool_called
    tool: Edit
    args_match:
      file_path: "\\.ai-factory/plans/feature-docs-unchanged\\.md$"
      new_string: "(?s)aif:task-outcome:skipped reason=\"documentation-unchanged\".*aif:commit-outcome:skipped-no-op reason=\"documentation-unchanged\""
    weight: 4
  - id: does-not-create-empty-commit
    type: no_tool_called
    tool: Bash
    args_match:
      command: "^git commit"
