scenario: deferred-doc-unchanged-resume
description: |
  After clearing the prior execution context, resuming a saved plan with a
  persisted documentation-unchanged no-op must not dispatch or reconcile an
  empty commit.
skill: aif-implement
argument: ""

runner:
  permission_mode: bypassPermissions
  allowed_tools_override:
    - Read
    - Write
    - Edit
    - Glob
    - Grep
    - Bash(git *)
    - AskUserQuestion
    - Questions
    - TaskCreate
    - TaskUpdate
    - TaskList

fixtures:
  git_init: true
  git_branch: feature/docs-unchanged-resume
  files_committed:
    - path: .ai-factory/plans/feature-docs-unchanged-resume.md
      content: |
        # Implementation Plan: Resume unchanged-doc outcome

        ## Settings
        - Testing: yes
        - Logging: verbose
        - Docs: yes
        - Commit strategy: incremental-at-end

        ## Tasks
        - [x] Task 1: Implement the feature
          Files: src/feature.js
        - [x] Task 2: Check and update feature documentation <!-- aif:task-outcome:skipped reason="documentation-unchanged" -->
          Files: docs/feature.md
        <!-- aif:task-kind:commit -->
        - [x] Task 3: Commit documentation with message "docs: document feature" <!-- aif:commit-outcome:skipped-no-op reason="documentation-unchanged" -->
          Depends on: 2
    - path: src/feature.js
      content: "export const feature = true;\n"
    - path: docs/feature.md
      content: |
        # Feature

        The feature is current and documented.

assertions:
  - id: reads-persisted-unchanged-outcome
    type: tool_called
    tool: Read
    args_match:
      file_path: "\\.ai-factory/plans/feature-docs-unchanged-resume\\.md$"
  - id: inspects-history-during-resume
    type: tool_called
    tool: Bash
    args_match:
      command: "^git log"
    weight: 2
  - id: does-not-create-empty-commit
    type: no_tool_called
    tool: Bash
    args_match:
      command: "^git commit"
  - id: keeps-unchanged-reason-visible
    type: output_contains
    pattern: "(?i)documentation-unchanged|documentation unchanged"
