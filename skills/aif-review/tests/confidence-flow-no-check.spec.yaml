# spec-only fixture (.spec.yaml): describes the contract for a future
# runner. No existing runner consumes this file, so a green CI does not
# prove the branches below executed. The statically checkable half of
# this contract IS executed in CI — see the "Review confidence /
# unverified-blocker contract" block in
# scripts/test-gate-result-contract.sh.

scenario: confidence-flow-no-check
description: |
  Coverage-first finding stage without `+check`. Confidence and severity
  are independent dimensions, so `/aif-review` (no flag) must:

    1. Place each finding in the section its IMPACT warrants, assuming
       the claim is true — not the section its certainty warrants.
    2. End an uncertain finding with exactly one of `(confidence: low)`
       or `(confidence: medium)`. High confidence is the default and
       carries NO marker.
    3. Never emit the literal string `(confidence: low|medium)` — the
       pipe form is documentation notation, not valid output.
    4. Report an uncertain potential merge-blocker in "Critical Issues"
       WITH a marker, and still leave it out of `blockers`: an
       unconfirmed claim must not block a merge by itself.
    5. Therefore emit `status: warn`, `blocking: false`, and
       `suggested_next.command: null` with a reason that names the
       unverified findings and points at `/aif-review +check`. Never
       `/aif-commit` — the change is not cleared for commit.

  Covers ichinya's PR #142 review asks 2, 3 and 6 (scenarios 1, 2, 5).
  The `+check` half — marker removal via `modify`, promotion of a
  confirmed marked critical into `blockers` — lives in
  confidence-flow-check.spec.yaml next to this file.

  Fixture state:
    Current branch:      main
    Committed baseline:  src/queue.ts with a straightforward consumer.
    Staged change:       the consumer acks BEFORE the handler runs
                         (potential message loss — critical IF the ack
                         semantics of the untyped `broker` are what they
                         look like, which the diff alone cannot settle →
                         uncertain potential blocker), plus a hardcoded
                         retry constant (certain, low impact → an
                         unmarked Suggestion).

  Runner requirements:
    - Handle `files_staged:`: write each path to disk AND `git add` it
      before invoking the skill, so `git diff --cached` is non-empty.

skill: aif-review
argument: ""
max_turns: 50

runner:
  model: claude-sonnet-4-6
  permission_mode: bypassPermissions
  allowed_tools_override:
    - Read
    - Glob
    - Grep
    - Bash(git *)
    - Bash(pwd)
    - Bash(basename *)
    - Bash(cd *)
    - Bash(printenv *)
    - AskUserQuestion

fixtures:
  git_init: true
  git_branch: main
  files_committed:
    - path: README.md
      content: |
        # Demo repo

        Fixture for the coverage-first finding stage. The staged diff
        carries one uncertain potential blocker and one certain
        low-impact nitpick.
    - path: package.json
      content: |
        {
          "name": "demo",
          "version": "0.1.0"
        }
    - path: src/queue.ts
      content: |
        export async function consume(broker: any, handler: (m: unknown) => Promise<void>) {
          const message = await broker.receive();
          await handler(message);
          await broker.ack(message);
        }
  files_staged:
    - path: src/queue.ts
      content: |
        const RETRY_DELAY_MS = 3000;

        export async function consume(broker: any, handler: (m: unknown) => Promise<void>) {
          const message = await broker.receive();
          // ack moved ahead of the handler: if the broker's ack is a
          // real delivery acknowledgement, a throwing handler loses the
          // message for good. `broker` is untyped and its module is not
          // part of this diff, so the reviewer cannot settle the
          // semantics here — uncertain, but critical if true.
          await broker.ack(message);
          try {
            await handler(message);
          } catch {
            await new Promise((r) => setTimeout(r, RETRY_DELAY_MS));
          }
        }

user_responses: []

assertions:
  - id: marked-critical-in-critical-section
    type: output_contains
    pattern: "### Critical Issues[\\s\\S]*\\(confidence: (low|medium)\\)"
    weight: 5

  - id: gate-does-not-block-on-unverified
    type: output_contains
    pattern: "\"status\":\\s*\"warn\"[\\s\\S]*\"blocking\":\\s*false"
    weight: 5

  - id: suggested-next-is-null
    type: output_contains
    pattern: "\"command\":\\s*null"
    weight: 4

  - id: reason-points-at-check
    type: output_contains
    pattern: "\\+check"
    weight: 3

  - id: never-suggests-commit-with-unverified-blockers
    type: no_output_contains
    pattern: "\"command\":\\s*\"/aif-commit\""

  - id: no-literal-pipe-marker
    type: no_output_contains
    pattern: "\\(confidence: low\\|medium\\)"

  - id: stay-in-sandbox
    type: no_path_escape
