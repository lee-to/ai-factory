# spec-only fixture (.spec.yaml): describes the contract for a future
# runner. No existing runner consumes this file, so a green CI does not
# prove the branches below executed. The statically checkable half of
# this contract IS executed in CI — see the "Review confidence /
# unverified-blocker contract" block in
# scripts/test-gate-result-contract.sh.

scenario: confidence-flow-check
description: |
  The `+check` half of the confidence lifecycle. Given the same staged
  change as confidence-flow-no-check.spec.yaml, `/aif-review +check`
  must resolve every confidence marker instead of carrying it through:

    1. A marked finding is a primary verification target for the
       validator (references/VALIDATOR.md).
    2. Confirming one uses `Verdict: modify` with `Modified-text` that
       is the item MINUS the marker. `keep` is not valid for a marked
       item — it returns the text verbatim, so the marker would survive
       and the finding would stay unresolved.
    3. Refuting one uses `Verdict: drop`.
    4. A confirmed marked critical is no longer "unverified": it enters
       `blockers`, drives `status` to `fail`, and moves
       `suggested_next.command` from `null` to `/aif-fix`.
    5. No confidence marker survives into the rendered output for any
       item the validator resolved.
    6. Classes outside the validated path are untouched: context-gate
       findings, commit-structure findings, "Questions", and "Positive
       Notes" are never sent to the validator and are never counted by
       the `Filtered:` line.

  Covers ichinya's PR #142 review asks 4 and 6 (scenarios 3, 4, 6).

  Fixture state: identical to confidence-flow-no-check.spec.yaml — the
  ack-before-handle change plus the hardcoded retry constant. The only
  difference is the `+check` argument and therefore the validator pass.

  Runner requirements:
    - Handle `files_staged:`: write each path to disk AND `git add` it
      before invoking the skill, so `git diff --cached` is non-empty.
    - The validator runs as a real `Task(subagent_type: general-purpose)`
      dispatch; the assertions below describe the rendered result, not
      the subagent's internal reasoning.

skill: aif-review
argument: "+check"
max_turns: 50

runner:
  model: claude-sonnet-4-6
  permission_mode: bypassPermissions
  allowed_tools_override:
    - Read
    - Glob
    - Grep
    - Bash(git *)
    - Bash(pwd)
    - Bash(basename *)
    - Bash(cd *)
    - Bash(printenv *)
    - Task
    - Agent
    - AskUserQuestion

fixtures:
  git_init: true
  git_branch: main
  files_committed:
    - path: README.md
      content: |
        # Demo repo

        Fixture for the `+check` confidence lifecycle: every marker is
        resolved by the validator, never carried through to the user.
    - path: package.json
      content: |
        {
          "name": "demo",
          "version": "0.1.0"
        }
    - path: src/queue.ts
      content: |
        export async function consume(broker: any, handler: (m: unknown) => Promise<void>) {
          const message = await broker.receive();
          await handler(message);
          await broker.ack(message);
        }
  files_staged:
    - path: src/queue.ts
      content: |
        const RETRY_DELAY_MS = 3000;

        export async function consume(broker: any, handler: (m: unknown) => Promise<void>) {
          const message = await broker.receive();
          // ack moved ahead of the handler — see
          // confidence-flow-no-check.spec.yaml for why this is an
          // uncertain-but-critical finding at the drafting stage.
          await broker.ack(message);
          try {
            await handler(message);
          } catch {
            await new Promise((r) => setTimeout(r, RETRY_DELAY_MS));
          }
        }

user_responses: []

assertions:
  - id: dispatches-check-validator
    type: tool_called
    tool: Task
    args_match:
      subagent_type: "^general-purpose$"
    weight: 4

  - id: renders-filtered-summary
    type: output_contains
    pattern: "Filtered:\\s+\\d+\\s+hidden,\\s+\\d+\\s+adjusted,\\s+\\d+\\s+reclassified\\s+by\\s+\\+check"
    weight: 3

  - id: no-marker-survives-check
    type: no_output_contains
    pattern: "\\(confidence: (low|medium)\\)"

  - id: no-literal-pipe-marker
    type: no_output_contains
    pattern: "\\(confidence: low\\|medium\\)"

  - id: confirmed-critical-blocks
    type: output_contains
    pattern: "\"status\":\\s*\"fail\"[\\s\\S]*\"blocking\":\\s*true"
    weight: 5

  - id: confirmed-critical-routes-to-fix
    type: output_contains
    pattern: "\"command\":\\s*\"/aif-fix\""
    weight: 4

  - id: gate-result-last
    type: output_contains
    pattern: "Filtered:[^\\n]*by \\+check[\\s\\S]*```aif-gate-result"
    weight: 3

  - id: stay-in-sandbox
    type: no_path_escape
