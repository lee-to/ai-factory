# Executable replay scenario; run npm run test:review-check (no live runtime).
scenario: check-mode-validator-failure
description: >
  Executed offline by scripts/test-review-check.mjs through the skill's shared
  check-workflow.mjs host protocol. Controlled recordings live in
  _replay/cases.json. Fixtures are staged in a real temporary Git repository; no
  inference or live tool fallback is permitted.
skill: aif-review
argument: +check
max_turns: 50
runner:
  permission_mode: bypassPermissions
  allowed_tools_override:
    - Read
    - Glob
    - Grep
    - Bash(git *)
    - Bash(gh *)
    - Bash(pwd)
    - Bash(basename *)
    - Bash(cd *)
    - Bash(printenv *)
    - AskUserQuestion
    - Questions
  runtime: review-replay
  model: recorded
fixtures:
  git_init: true
  git_branch: main
  files_committed:
    - path: README.md
      content: |
        # Demo repo

        Fixture for /aif-review +check validator-failure fallback.
    - path: package.json
      content: |
        {
          "name": "demo",
          "version": "0.1.0"
        }
    - path: src/auth.ts
      content: |
        export function verifyToken(token: string): boolean {
          return token === 'expected-token';
        }
  files_staged:
    - path: src/auth.ts
      content: |
        export function verifyToken(token: string): boolean {
          if (token === 'expected-token') return true;
          return false;
        }
    - path: src/handler.ts
      content: |
        import { verifyToken } from './auth';

        export function handle(req: { token: string }) {
          verifyToken(req.token);
          return { status: 200 };
        }
user_responses: []
assertions:
  - id: warn-fallback-line
    type: output_contains
    pattern: WARN \[\+check\]:\s+validator failed\s*\([^)]+\),\s+all items kept as-is
    weight: 4
  - id: no-filtered-summary
    type: output_contains
    pattern: ^(?![\s\S]*(?:Filtered:[^\n]*by \+check))[\s\S]*$
  - id: gate-result-block-present
    type: output_contains
    pattern: "```aif-gate-result"
    weight: 3
  - id: warn-before-gate-result
    type: output_contains
    pattern: WARN \[\+check\][\s\S]*```aif-gate-result
    weight: 3
  - id: stay-in-sandbox
    type: no_path_escape
