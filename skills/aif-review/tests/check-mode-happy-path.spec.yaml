# Executable replay scenario; run npm run test:review-check (no live runtime).
scenario: check-mode-happy-path
description: >
  Executed offline by scripts/test-review-check.mjs through the skill's shared
  check-workflow.mjs host protocol. Controlled recordings live in
  _replay/cases.json. Fixtures are staged in a real temporary Git repository; no
  inference or live tool fallback is permitted.
skill: aif-review
argument: +check
max_turns: 50
runner:
  permission_mode: bypassPermissions
  allowed_tools_override:
    - Read
    - Glob
    - Grep
    - Bash(git *)
    - Bash(gh *)
    - Bash(pwd)
    - Bash(basename *)
    - Bash(cd *)
    - Bash(printenv *)
    - Task
    - Agent
    - AskUserQuestion
    - Questions
  runtime: review-replay
  model: recorded
fixtures:
  git_init: true
  git_branch: main
  files_committed:
    - path: README.md
      content: |
        # Demo repo

        Fixture for /aif-review +check happy path. The committed baseline
        is intentionally minimal so the staged diff contains both a
        Critical Issue (silently-ignored verifier return) and at least
        one Suggestion (timing-leak comparison).
    - path: package.json
      content: |
        {
          "name": "demo",
          "version": "0.1.0"
        }
    - path: src/auth.ts
      content: |
        export function verifyToken(token: string): boolean {
          return token === 'expected-token';
        }
  files_staged:
    - path: src/auth.ts
      content: |
        export function verifyToken(token: string): boolean {
          // direct equality leaks timing information — a reasonable
          // Suggestion-level finding the validator can keep or reword.
          if (token === 'expected-token') return true;
          return false;
        }
    - path: src/handler.ts
      content: |
        import { verifyToken } from './auth';

        export function handle(req: { token: string }) {
          // verifier return value is ignored: every unauthenticated
          // request silently 200s — Critical Issue material.
          verifyToken(req.token);
          return { status: 200 };
        }
user_responses: []
assertions:
  - id: dispatches-check-validator
    type: tool_called
    tool: Task
    args_match:
      subagent_type: ^review-validator$
    weight: 4
  - id: renders-filtered-summary
    type: output_contains
    pattern: Filtered:\s+\d+\s+hidden,\s+\d+\s+adjusted,\s+\d+\s+reclassified\s+by\s+\+check
    weight: 4
  - id: gate-result-block-present
    type: output_contains
    pattern: "```aif-gate-result"
    weight: 3
  - id: filtered-line-before-gate-result
    type: output_contains
    pattern: Filtered:[^\n]*by \+check[\s\S]*```aif-gate-result
    weight: 3
  - id: no-warn-on-success
    type: output_contains
    pattern: ^(?![\s\S]*(?:WARN \[\+check\]))[\s\S]*$
  - id: stay-in-sandbox
    type: no_path_escape
